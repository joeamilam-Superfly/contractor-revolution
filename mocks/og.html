<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../node_modules/@fontsource/barlow-condensed/600.css" />
    <link rel="stylesheet" href="../node_modules/@fontsource/source-sans-3/400.css" />
    <link rel="stylesheet" href="../node_modules/@fontsource/source-sans-3/600.css" />
    <style>
      html, body { margin: 0; width: 1200px; height: 630px; }
      body {
        display: grid;
        grid-template-columns: 1.4fr 0.8fr;
        background: #f3efe4;
        color: #1c1915;
        font-family: "Source Sans 3", sans-serif;
        border-top: 18px solid #8d2f14;
        box-sizing: border-box;
      }
      .copy { padding: 72px 64px; display: flex; flex-direction: column; justify-content: space-between; }
      .kicker { margin: 0 0 18px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; color: #8d2f14; font-size: 22px; }
      h1 { margin: 0 0 18px; font-family: "Barlow Condensed", sans-serif; font-size: 92px; line-height: 0.88; font-weight: 600; }
      .blurb { margin: 0; font-size: 32px; max-width: 18ch; }
      .url { margin: 0; font-size: 24px; font-weight: 600; }
      .card { margin: 48px 48px 48px 0; background: #1c1915; color: #f3efe4; padding: 36px 32px; display: flex; flex-direction: column; justify-content: flex-end; }
      .card span { letter-spacing: 0.08em; text-transform: uppercase; font-size: 18px; }
      .card strong { font-family: "Barlow Condensed", sans-serif; font-size: 120px; line-height: 0.85; font-weight: 600; }
      .card em { font-style: normal; font-size: 26px; }
    </style>
  </head>
  <body>
    <div class="copy">
      <div>
        <p class="kicker">A product of Isom Technologies</p>
        <h1>Contractor Revolution</h1>
      </div>
      <p class="blurb">Time, work orders, and billing for contractors.</p>
      <p class="url">www.contractor-revolution.co</p>
    </div>
    <div class="card">
      <span>Crew · 10 users</span>
      <strong>$329</strong>
      <em>per month</em>
    </div>
  </body>
</html>
